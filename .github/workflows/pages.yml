name: Publish comparison page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  assemble:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified media
        run: |
          mkdir public
          cp index.html *.jpg public/
          jq -r '.[] | [.file, .url, .sha256] | @tsv' media.json | while IFS=$'\t' read -r file url digest; do
            curl --fail --location --retry 4 --silent --show-error "$url" -o "public/$file"
            echo "$digest  public/$file" | sha256sum --check -
          done
      - uses: actions/cache@v4
        id: previews
        with:
          path: previews
          key: listener-previews-${{ hashFiles('media.json', 'scripts/make_previews.py') }}
      - name: Encode and check low-bandwidth playback copies
        if: steps.previews.outputs.cache-hit != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 scripts/make_previews.py
      - run: cp previews/*-stream.mp4 public/
      - name: Assemble the five listener comparisons
        run: |
          cp -R step1325 public/step1325
          mkdir -p public/step1325/videos
          jq -r '.[] | [.file, .url, .sha256] | @tsv' step1325/media.json | while IFS=$'\t' read -r file url digest; do
            dest="public/step1325/videos/$file"
            curl --fail --location --retry 4 --silent --show-error "$url" -o "$dest"
            echo "$digest  $dest" | sha256sum --check -
          done
      - uses: actions/configure-pages@v5
      - id: bundle
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: ${{ steps.bundle.outputs.name }}
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: release
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: ${{ needs.assemble.outputs.artifact_name }}
      - name: Allow time for the uploaded archive to appear
        if: steps.release.outcome == 'failure'
        run: sleep 15
      - id: retry
        if: steps.release.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.assemble.outputs.artifact_name }}
