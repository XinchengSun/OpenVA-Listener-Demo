name: Publish self-contained phone site
on:
  push:
    branches: [site-bundle]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir public
          cp index.html *.jpg *.mp4 public/
          cd public
          sha256sum --check ../media.sha256
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
