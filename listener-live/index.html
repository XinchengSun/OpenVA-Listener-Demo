<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenVA · 聆听素材工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#192942;font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1320px;margin:auto;padding:28px clamp(14px,3vw,48px)}header,.bar,.tabs,.nums{display:flex;align-items:center;gap:14px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #c8d1db;padding-bottom:16px}h1{font-size:27px;margin:0}small,.dim{color:#53677c}#stamp{font-size:13px}.nums{padding:22px 0;justify-content:space-between}.nums b{display:block;font:600 25px/1.35 Consolas,monospace}.nums small{font-size:13px}.track{height:7px;background:#dae1e9;border-radius:6px;overflow:hidden}.track i{height:100%;display:block;background:#226ab3}#pipeline{margin:9px 0 24px;font-size:13px;color:#48617c}.work{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,1fr);gap:25px}.viewer,.library{min-width:0}.screen{background:#132031;border-radius:10px;overflow:hidden}.screen video{display:block;margin:auto;width:100%;height:min(51vh,480px);object-fit:contain}h2{font-size:18px;margin:0}.bar{justify-content:space-between;margin-bottom:10px}button,select,input{font:inherit;border:1px solid #bdcad8;border-radius:6px;background:white;color:inherit;padding:6px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #368bda}.tabs{gap:6px}.on{background:#234e7e;color:white}input{min-width:100px;flex:1}.tools{display:flex;gap:6px;margin:0 0 9px}.list{max-height:57vh;overflow:auto;background:white;border-radius:8px}.row{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #e3e8ee;border-radius:0;padding:10px 14px}.row.active{box-shadow:inset 4px 0 #227ac6;background:#e8f1fa}.row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{font:12px Consolas,monospace}.quote{font-size:19px;line-height:1.5;margin:12px 0 5px}.meta{font-size:13px}.status{color:#346183}#range{width:100%;padding:0}#count{font-size:13px}@media(max-width:760px){.work{grid-template-columns:1fr}.nums{display:grid;grid-template-columns:1fr 1fr}.screen video{height:35vh}.list{max-height:45vh}main{padding-top:14px}} 
#bars{display:flex;align-items:end;gap:3px;height:24px}#bars i{width:6px;background:#287e89}.nums{align-items:flex-start}.screen{position:relative}#pending{position:absolute;color:white;top:30%;width:100%;text-align:center}.bar h2{font-family:Consolas,"Microsoft YaHei",sans-serif}.row.active{background:#e2f1f0;box-shadow:inset 4px 0 #257d82}.track i,.on{background:#226e76}header{border-top:4px solid #245966;padding-top:15px}input[type=range]{accent-color:#226e76}</style><main><header><h1>OpenVA · 聆听素材工作台</h1><span id="stamp">正在读取进度…</span></header><section class="nums"><div><small>计划产出</small><b id="goal">—</b></div><div><small>超分速度 · 近 15 分钟</small><b id="rate">—</b><span id="bars" aria-label="最近十五分钟逐分钟超分条数"></span></div><div><small>预计剩余超分时间</small><b id="eta">—</b></div><div><small>已公开超分片段</small><b id="ready">—</b></div></section><div class="track"><i id="fill"></i></div><div id="pipeline"></div><div class="work"><section class="viewer"><div class="bar"><h2 id="name">片段预览</h2><div class="tabs"><button id="raw">原始切片</button><button id="hd">超分成片</button></div></div><div class="screen"><p id="pending" hidden>这条视频正在准备公开播放。</p><video id="vid" controls playsinline preload="metadata"></video></div><input type="range" id="range" aria-label="片段内进度" min="0" max="1000" value="0"><p class="quote" id="quote"></p><div class="meta dim" id="meta"></div></section><section class="library"><div class="bar"><h2>片段列表</h2><span id="count"></span></div><div class="tools"><input id="search" type="search" placeholder="搜索逐字稿、编号或文件名" aria-label="搜索片段"><select id="filter" aria-label="状态筛选"></select></div><div class="list" id="list"></div></section></div></main>
<script src="cases.js"></script><script>
const BASE='https://huggingface.co/datasets/xinxin713/OpenVA-Listener-Recordings-1124/resolve/main/';const $=id=>document.getElementById(id),data=window.cases||[],stages=['待裁剪','已裁剪','已超分','已提特征','可看超分','人脸待核','数字人说话','角色待核','等待同步'];let sel,mode,start=0,end=0,map={},local=new Set,updated=false;
for(const v of ['全部候选','聆听候选',...stages])$('filter').add(new Option(v,v));$('filter').value='聆听候选';
function stage(x){return x.role==='avatar'?stages[6]:x.role==='review'?stages[7]:map[x.id]||stages[8]}
function list(){const q=$('search').value.toLowerCase(),f=$('filter').value,frag=document.createDocumentFragment();let n=0;for(const x of data){const s=stage(x);if(f==='聆听候选'&&x.role!=='listener'||!['全部候选','聆听候选'].includes(f)&&s!==f||!(x.id+' '+x.source+' '+x.text).toLowerCase().includes(q))continue;n++;let b=document.createElement('button');b.className='row'+(sel===x?' active':'');let a=document.createElement('small'),t=document.createElement('span');a.textContent=x.id+'　'+s+'　'+(x.end-x.start).toFixed(1)+' s';t.textContent=x.text;b.append(a,t);b.onclick=()=>pick(x,local.has(x.id)?'hd':'raw');frag.append(b)}$('list').replaceChildren(frag);$('count').textContent=n+' 条';if(!n)$('list').textContent='没有匹配的片段'}
function controls(){if(!sel)return;$('hd').disabled=!local.has(sel.id);$('hd').className=mode==='hd'?'on':'';$('raw').className=mode==='raw'?'on':'';$('meta').textContent=sel.source+'　·　'+sel.start.toFixed(2)+'–'+sel.end.toFixed(2)+' 秒　·　'+stage(sel)}
function pick(x,m){sel=x;mode=m;const v=$('vid');v.pause();start=0;end=x.end-x.start;v.onloadedmetadata=()=>{v.currentTime=start};if(m==='hd'||(window.live?.raw||[]).includes(x.id)){v.src=BASE+(m==='hd'?'hd/':'raw/')+x.id+'.mp4';$('pending').hidden=true}else{v.removeAttribute('src');v.load();$('pending').hidden=false};$('name').textContent=x.id;$('quote').textContent=x.text;$('range').value=0;controls();list()}
$('raw').onclick=()=>pick(sel,'raw');$('hd').onclick=()=>pick(sel,'hd');$('vid').ontimeupdate=()=>{let v=$('vid');if(v.currentTime>=end&&!v.paused)v.pause();$('range').value=Math.max(0,Math.min(1000,(v.currentTime-start)/(end-start)*1000))};$('vid').onplay=()=>{let v=$('vid');if(v.currentTime<start||v.currentTime>=end-.04)v.currentTime=start};$('range').oninput=e=>{$('vid').currentTime=start+(end-start)*Number(e.target.value)/1000};$('search').oninput=list;$('filter').onchange=list;
function paint(){let z=window.live||{},sr=z.sr||{},now=Date.now()/1000,stale=z.offline||!z.t||now-z.t>240;local=new Set(z.local||[]);const eligible=data.filter(x=>x.role==='listener');map={};if(z.t)for(const x of eligible)map[x.id]=stages[0];for(const [i,ids] of [[1,z.crop],[2,Object.keys(sr)],[3,z.cache],[4,z.local],[5,z.errors]])for(const id of ids||[])map[id]=stages[i];let recent=eligible.filter(x=>sr[x.id]>z.t-900),sum=xs=>xs.reduce((a,x)=>a+x.end-x.start,0),rem=eligible.filter(x=>!sr[x.id]&&stage(x)!==stages[5]),mins=sum(rem)*15/sum(recent);$('goal').textContent=eligible.length+' 条';$('rate').textContent=stale?'—':recent.length*4+' 条/时';$('eta').textContent=stale||!isFinite(mins)?'—':Math.floor(mins/60)+' 小时 '+Math.ceil(mins%60)+' 分';$('ready').textContent=local.size+' 条';$('stamp').textContent=(stale?'数据待更新':'最近采样')+' · '+(z.t?new Date(z.t*1000).toLocaleTimeString():'等待读数');$('fill').style.width=100*Object.keys(sr).length/eligible.length+'%';$('pipeline').textContent=z.t?'已裁剪 '+z.crop.length+'　 /　 已超分 '+Object.keys(sr).length+'　 /　 已提取动作 '+z.cache.length+'　 /　 人脸待核 '+z.errors.length:'等待服务器进度';let buckets=Array(15).fill(0);for(let t of Object.values(sr)){let i=14-Math.floor((z.t-t)/60);if(i>=0&&i<15)buckets[i]++}let peak=Math.max(1,...buckets);$('bars').replaceChildren(...buckets.map((v,i)=>{let b=document.createElement('i');b.style.height=(2+21*v/peak)+'px';b.title='第 '+(i+1)+' 分钟 · '+v+' 条';return b}));if(sel&&$('pending').hidden===false&&((z.raw||[]).includes(sel.id)||local.has(sel.id)))pick(sel,local.has(sel.id)?'hd':'raw');if(!sel&&eligible.length)pick(eligible.find(x=>local.has(x.id))||eligible[0],local.size?'hd':'raw');else{controls();list()}}
async function sync(){try{let r=await fetch(BASE+'live.json?v='+Math.floor(Date.now()/30000),{cache:'no-store'});if(!r.ok)throw Error(r.status);window.live=await r.json();paint()}catch(e){if(window.live){window.live.offline=true;paint()}else{$('stamp').textContent='进度暂不可达，正在重试'}}}sync();setInterval(sync,30000);</script></html>
